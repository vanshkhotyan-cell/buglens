stages:
  prepare:
    cmd: python -m buglens.pipeline prepare
    deps:
      - buglens/dataset.py
      - buglens/pipeline.py
    params:
      - prepare.seed
      - prepare.cal_size
      - prepare.test_size
    outs:
      - data/processed/train.csv
      - data/processed/cal.csv
      - data/processed/test.csv

  evaluate:
    cmd: python -m buglens.pipeline evaluate
    deps:
      - buglens/evaluation.py
      - buglens/modeling/fusion.py
      - buglens/pipeline.py
      - data/processed/cal.csv
      - data/processed/test.csv
    params:
      - evaluate.eps
      - evaluate.target_precision
    metrics:
      - reports/metrics.json:
          cache: false
