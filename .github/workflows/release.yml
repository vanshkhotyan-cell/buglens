name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build-and-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Build wheel and sdist
        run: uv build --no-sources
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c 'import buglens; print(1)'
      - name: Smoke-test sdist
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c 'import buglens; print(1)'
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: build-scan-and-push-ghcr
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build local image for Trivy scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/vanshkhotyan-cell/buglens:${{ github.ref_name }}
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/vanshkhotyan-cell/buglens:${{ github.ref_name }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vanshkhotyan-cell/buglens:${{ github.ref_name }}
      - name: Record image digest
        run: echo 'Published digest ${{ steps.push.outputs.digest }}'

  publish:
    name: publish-to-pypi
    needs: build
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI via OIDC
        run: uv publish
