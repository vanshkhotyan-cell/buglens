[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "buglens"
version = "0.0.1"
description = "brief description of Buglens"
authors = [
  { name = "Vansh Khotyan" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "dagshub>=0.7.3",
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "fastapi>=0.165.0",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mlflow>=3.18.0",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "pyyaml>=6.0.4",
    "ruff",
    "scikit-learn",
    "streamlit>=1.67.0",
    "sympy>=1.14.0",
    "tqdm",
    "typer",
    "uvicorn>=0.54.0",
]
requires-python = ">=3.12"


[tool.ruff]
line-length = 100
extension = {mdx = "markdown", qmd = "markdown" }
src = ["buglens"]
include = ["pyproject.toml", "buglens/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["buglens"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
]
